name: Weekly maintenance

on:
  schedule:
    - cron: "17 6 * * 1" # Mondays 06:17 UTC
  workflow_dispatch:

permissions:
  contents: read
  issues: write

jobs:
  health:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install latest test tools
        run: |
          pip install --upgrade -r requirements-dev.txt
          python -m playwright install --with-deps chromium
      - name: Checks + tests on the latest Chromium
        id: tests
        run: |
          python scripts/check.py
          pytest -q
      - name: Vendored library updates
        id: vendor
        run: python scripts/vendor.py outdated | tee vendor-report.txt
      - name: Check the live site responds
        if: always()
        run: |
          url="https://${GITHUB_REPOSITORY_OWNER}.github.io/${GITHUB_REPOSITORY#*/}/version.txt"
          curl -fsS "$url" || echo "::warning::Live site not reachable at $url (is Pages enabled?)"
      - name: Open an issue when something broke
        if: failure()
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh issue create \
            --title "Weekly maintenance failed ($(date -u +%Y-%m-%d))" \
            --label maintenance \
            --body "The scheduled health check failed: ${GITHUB_SERVER_URL}/${GITHUB_REPOSITORY}/actions/runs/${GITHUB_RUN_ID}

          Assign this to Copilot or run the **maintainer** agent to triage." \
          || gh issue create --title "Weekly maintenance failed" --body "See ${GITHUB_SERVER_URL}/${GITHUB_REPOSITORY}/actions/runs/${GITHUB_RUN_ID}"
